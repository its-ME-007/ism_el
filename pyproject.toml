[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-aware-predictive-tiering"
version = "0.1.0"
description = "Reproducible research framework for predictive storage tiering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "simpy>=4.0",
  "nltk>=3.8",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2", "faiss-cpu>=1.7"]
visualization = ["matplotlib>=3.7", "seaborn>=0.13"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0"]
dev = ["pytest>=8.0", "hypothesis>=6.0", "pytest-cov>=5.0"]

[project.scripts]
tiering = "src.tiering.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

